<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Web mai Chart X 譜面播放器，支援流暢預覽與模擬遊玩 maimai 譜面。">
    <title>Web mai Chart X - Play</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="preload" as="image" href="../Skin/Shared/outline.png" fetchpriority="high">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">
    </noscript>

    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    </noscript>

    <link rel="stylesheet" href="Styles/playControls.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="Styles/settings.css">
    <link rel="stylesheet" href="Styles/popup.css">
    <link rel="stylesheet" href="Styles/drive.css">
</head>

<body>
    <div
        style="user-select:none;z-index: 100;position: fixed; top: 0; right: 0; background-color: #00000080;color: whitesmoke;margin: 10px; padding: 10px; border-radius: 40px; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -o-user-select: none;">
        BETA</div>

    <main id="app" role="main"
        style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow: hidden;">
        <div id="canvasContainer">
            <canvas id="main" aria-label="譜面播放畫布"></canvas>
            <div class="backgroundContainer">
                <img src="" alt="背景圖片" onerror="this.style.display='none'" id="backgroundImage">
                <video src="" alt="背景影片" onerror="this.style.display = 'none'" id="backgroundVideo" muted playsinline
                    webkit-playsinline x5-playsinline disablePictureInPicture disableRemotePlayback></video>
            </div>
        </div>
        <div id="playControls">
            <div id="playCapsulesContainer" class="play-capsules-container" aria-hidden="true">
                <div id="timeDisplayCapsule" class="time-display-capsule">00:00.00 / 00:00.00</div>
                <div id="speedDisplayCapsule" class="speed-display-capsule">1.00x</div>
            </div>
            <div id="playControlContainer">
                <input type="range" id="timeControl" min="0" max="1" value="0" step="0.01" aria-label="播放進度">
                <div class="controlsContainer">
                    <div class="controlButton" data-buttonAction="reset" title="重新開始" role="button" tabindex="0"
                        aria-label="重新開始">
                        <span class="material-symbols-outlined" translate="no">
                            skip_previous
                        </span>
                    </div>
                    <div class="controlButton" data-buttonAction="play/pause" data-playing="false" title="播放 / 暫停"
                        role="button" tabindex="0" aria-label="播放或暫停">
                        <span class="material-symbols-outlined" translate="no">
                            play_arrow
                        </span>
                    </div>
                    <div class="controlButton" data-buttonAction="autoPlay" data-autoplay="computer"
                        title="自動" role="button" tabindex="0" data-i18n-aria-label="settings.items.autoPlay" aria-label="遊玩模式">
                        <span class="material-symbols-outlined" translate="no">
                            computer
                        </span>
                    </div>
                    <div class="controlSpeedAnchor">
                        <button type="button" class="controlButton" data-buttonAction="speed" aria-controls="speedPopover"
                            data-i18n-aria-label="menu.playbackSpeed" data-i18n-title="menu.playbackSpeed"
                            aria-label="播放速度" title="播放速度" aria-expanded="false">
                            <span class="material-symbols-outlined" translate="no">
                                speed
                            </span>
                        </button>
                        <div id="speedPopover" class="speed-popover" role="toolbar" aria-hidden="true" inert
                            data-i18n-aria-label="menu.playbackSpeed" aria-label="播放速度">
                            <button type="button" id="speedPopoverMinus" class="splitter-toolbar-btn"
                                data-i18n-aria-label="settings.keybindings.playbackSpeedDown"
                                data-i18n-title="settings.keybindings.playbackSpeedDown" aria-label="減速播放 (-0.25x)"
                                title="減速播放 (-0.25x)">
                                <span class="material-symbols-outlined splitter-icon" translate="no">remove</span>
                            </button>
                            <input type="text" id="speedPopoverInput" class="speed-popover-input" inputmode="decimal"
                                value="1.00x" data-i18n-aria-label="menu.playbackSpeed" aria-label="播放速度">
                            <button type="button" id="speedPopoverAdd" class="splitter-toolbar-btn"
                                data-i18n-aria-label="settings.keybindings.playbackSpeedUp"
                                data-i18n-title="settings.keybindings.playbackSpeedUp" aria-label="加速播放 (+0.25x)"
                                title="加速播放 (+0.25x)">
                                <span class="material-symbols-outlined splitter-icon" translate="no">add</span>
                            </button>
                            <button type="button" id="speedPopoverReset" class="splitter-toolbar-btn"
                                data-i18n-aria-label="toast.resetPlaybackSpeed"
                                data-i18n-title="toast.resetPlaybackSpeed" aria-label="重置播放速度" title="重置播放速度">
                                <span class="material-symbols-outlined splitter-icon" translate="no">restart_alt</span>
                            </button>
                        </div>
                    </div>
                    <div class="controlButton" data-buttonAction="hide" data-hidden="false" title="隱藏面板" role="button"
                        tabindex="0" aria-label="收合控制面板">
                        <span class="material-symbols-outlined" translate="no">
                            keyboard_arrow_down
                        </span>
                    </div>
                    <button type="button" class="controlButton" data-buttonAction="openProject"
                        data-i18n-title="menu.fileProjectManager" data-i18n-aria-label="menu.fileProjectManager"
                        title="專案總管" aria-label="專案總管">
                        <span class="material-symbols-outlined" translate="no">topic</span>
                    </button>
                    <label class="controlButton play-difficulty" data-i18n-title="menu.changeDifficulty" title="難度">
                        <span class="material-symbols-outlined" translate="no" aria-hidden="true">layers</span>
                        <select id="playDifficulty" data-i18n-aria-label="menu.changeDifficulty" aria-label="難度" disabled></select>
                    </label>
                    <div class="controlButton" data-buttonAction="settings" title="設定" role="button" tabindex="0"
                        aria-label="遊戲設定">
                        <span class="material-symbols-outlined" translate="no">
                            settings
                        </span>
                    </div>
                    <div class="controlButton" data-buttonAction="fullscreen" title="全螢幕" role="button" tabindex="0"
                        aria-label="全螢幕">
                        <span class="material-symbols-outlined" translate="no">
                            fullscreen
                        </span>
                    </div>
                    <!-- <div class="controlButton" data-buttonAction="slideDebug" title="滑軌除錯" role="button" tabindex="0" aria-label="滑軌除錯">
                        <span class="material-symbols-outlined" translate="no">
                            bug_report
                        </span>
                    </div> -->
                </div>
            </div>
            <div id="showPlayControlsBtn" title="顯示控制列" role="button" tabindex="0" aria-label="顯示控制列">
                <span class="splitter-toolbar-btn" aria-hidden="true">
                    <span class="material-symbols-outlined" translate="no">keyboard_arrow_up</span>
                </span>
            </div>
        </div>
    </main>
    <script type="module" src="main.js"></script>
</body>

</html>
