<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="../Styles/popup.css">
    <title>Web mai Chart X - Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Noto+Sans+TC:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <div
        style="user-select:none;z-index: 100;position: fixed; top: 0; right: 0; background-color: #00000080;color: whitesmoke;margin: 10px; padding: 10px; border-radius: 0 0 10px 0;">
        BETA</div>
    <div id="canvasContainer">
        <img src="../Skin/outline.png" alt="outline" onerror="this.style.display = 'none'" id="canvasOutline">
        <canvas id="main"></canvas>
        <div class="backgroundContainer">
            <img src="" alt="" onerror="this.style.display='none'" id="backgroundImage">
            <video src="" alt="video" onerror="this.style.display = 'none'" id="backgroundVideo" muted></video>
        </div>
    </div>
    <div id="playControls">
        <div id="playControlContainer">
            <input type="range" id="timeControl" min="0" max="1" value="0" step="0.01">
            <div class="controlsContainer">
                <div class="controlButton" data-buttonAction="reset" title="重新開始">
                    <span class="material-symbols-outlined" translate="no">
                        skip_previous
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="play/pause" data-playing="false" title="播放 / 暫停">
                    <span class="material-symbols-outlined" translate="no">
                        play_arrow
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="autoPlay" data-autoplay="true" title="Auto / Manual Play">
                    <span class="material-symbols-outlined" translate="no">
                        smart_toy
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="playbackSpeedMinus" title="減慢播放速度 (Ctrl+O / -0.25x)">
                    <span class="material-symbols-outlined" translate="no">
                        remove
                    </span>
                </div>
                <div class="controlButton playbackSpeedButton" data-buttonAction="playbackSpeed"
                    title="播放速度 (點擊重設為 1.00x)">
                    <input type="number" step="0.05" min="0.25" max="2" value="1.00" id="playbackSpeedInput">
                    <span class="speedUnit">x</span>
                </div>
                <div class="controlButton" data-buttonAction="playbackSpeedAdd" title="加快播放速度 (Ctrl+P / +0.25x)">
                    <span class="material-symbols-outlined" translate="no">
                        add
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="hide" data-hidden="false" title="隱藏面板">
                    <span class="material-symbols-outlined" translate="no">
                        keyboard_arrow_down
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="openProject" title="專案總管">
                    <span class="material-symbols-outlined" translate="no">
                        topic
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="openFolder" title="開啟本機資料夾">
                    <span class="material-symbols-outlined" translate="no">
                        folder
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="settings" title="設定">
                    <span class="material-symbols-outlined" translate="no">
                        settings
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="connection" title="連線同步設定">
                    <span class="material-symbols-outlined" translate="no">
                        sync
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="slideDebug" title="滑軌除錯">
                    <span class="material-symbols-outlined" translate="no">
                        bug_report
                    </span>
                </div>
            </div>
        </div>
        <div id="showPlayControlsBtn" title="顯示控制列">
            <span class="material-symbols-outlined" translate="no">
                keyboard_arrow_up
            </span>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
