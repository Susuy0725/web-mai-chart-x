<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Noto+Sans+TC:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=folder,keyboard_arrow_down,keyboard_arrow_up,pause,play_arrow,skip_previous,smart_toy,stop,touch_app" />
</head>

<body>
    <div id="canvasContainer">
        <img src="../Skin/outline.png" alt="outline" onerror="this.style.display = 'none'" id="canvasOutline">
        <canvas id="main"></canvas>
        <div class="backgroundContainer">
            <img src="" alt="" onerror="this.style.display='none'" id="backgroundImage">
            <video src="" alt="video" onerror="this.style.display = 'none'" id="backgroundVideo" muted></video>
        </div>
    </div>
    <div id="playControls">
        <div id="playControlContainer">
            <input type="range" id="timeControl" min="0" max="1" value="0" step="0.01">
            <div class="controlsContainer">
                <div class="controlButton" data-buttonAction="reset">
                    <span class="material-symbols-outlined" translate="no">
                        skip_previous
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="play/pause" data-playing="false">
                    <span class="material-symbols-outlined" translate="no">
                        play_arrow
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="autoPlay" data-autoplay="true" title="Auto / Manual Play">
                    <span class="material-symbols-outlined" translate="no">
                        smart_toy
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="hide" data-hidden="false">
                    <span class="material-symbols-outlined" translate="no">
                        keyboard_arrow_down
                    </span>
                </div>
                <div class="controlButton" data-buttonAction="openFolder">
                    <span class="material-symbols-outlined" translate="no">
                        folder
                    </span>
                </div>
            </div>
        </div>
        <div id="showPlayControlsBtn">
            <span class="material-symbols-outlined" translate="no">
                keyboard_arrow_up
            </span>
        </div>
    </div>
    <script type="module" src="../Scripts/indexDB.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
