<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web mai Chart X - 資料遷移接收器</title>
    <link rel="icon" href="./favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-card: rgba(22, 27, 34, 0.85);
            --border-card: rgba(255, 255, 255, 0.1);
            --accent-primary: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --accent-success: #00e676;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(58, 123, 213, 0.12) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon-box {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 210, 255, 0.35);
        }

        .icon-box svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .status-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 4px;
            transition: width 0.25s ease;
        }

        .log-container {
            max-height: 140px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            text-align: left;
            margin-top: 14px;
        }

        .log-entry.success { color: var(--accent-success); }
        .log-entry.info { color: var(--accent-primary); }
        .log-entry.warn { color: #ffd600; }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.45);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon-box" id="iconBox">
            <svg viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
            </svg>
        </div>

        <h1>Web mai Chart X 資料遷移接收器</h1>
        <p class="subtitle" id="subtitleText">正在等待舊網域發送譜面專案資料...</p>

        <div class="status-box">
            <div class="status-header">
                <span>傳輸進度</span>
                <span id="percentText">0%</span>
            </div>
            <div class="status-text">
                <span id="statusSpinner" class="spinner"></span>
                <span id="statusMessage">等待連線中...</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-entry info">[系統] 接收器就緒，已開啟跨網域資料接收通道</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="launchBtn" disabled onclick="window.location.href='./index.html'">
                前往 Web mai Chart X
            </button>
        </div>
    </div>

    <script type="module">
        import { idbSet, openDB } from './Scripts/indexDB.js';

        const statusSpinner = document.getElementById('statusSpinner');
        const statusMessage = document.getElementById('statusMessage');
        const percentText = document.getElementById('percentText');
        const progressFill = document.getElementById('progressFill');
        const logContainer = document.getElementById('logContainer');
        const launchBtn = document.getElementById('launchBtn');
        const subtitleText = document.getElementById('subtitleText');

        function addLog(text, type = '') {
            const el = document.createElement('div');
            el.className = `log-entry ${type}`;
            el.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            logContainer.appendChild(el);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        let senderSource = null;
        let senderOrigin = null;
        let totalCount = 0;
        let receivedCount = 0;

        window.addEventListener('message', async (event) => {
            const data = event.data;
            if (!data || typeof data !== 'object') return;

            // 1. 握手請求 (Handshake)
            if (data.type === 'WMC_MIGRATE_HANDSHAKE') {
                senderSource = event.source;
                senderOrigin = event.origin;

                addLog(`收到來自 ${senderOrigin} 的連線請求`, 'info');
                statusMessage.textContent = '已與舊網域建立連線，準備接收資料...';

                // 回覆 ACK
                event.source.postMessage({
                    type: 'WMC_MIGRATE_HANDSHAKE_ACK',
                    status: 'ready'
                }, event.origin);
                return;
            }

            // 2. 傳輸開始 (Start)
            if (data.type === 'WMC_MIGRATE_START') {
                totalCount = data.totalItems || 0;
                receivedCount = 0;
                statusMessage.textContent = `開始接收資料 (共 ${totalCount} 個項目)...`;
                addLog(`開始接收專案資料，預估項目數: ${totalCount}`);

                // 備份 / 轉移 localStorage 設定
                if (data.localStorage && typeof data.localStorage === 'object') {
                    for (const [k, v] of Object.entries(data.localStorage)) {
                        try {
                            localStorage.setItem(k, v);
                        } catch (e) {
                            console.warn("無法寫入 localStorage:", k, e);
                        }
                    }
                    addLog(`已同步 ${Object.keys(data.localStorage).length} 項使用者偏好設定`, 'info');
                }
                return;
            }

            // 3. 接收單一資料項 (Item)
            if (data.type === 'WMC_MIGRATE_ITEM') {
                const { key, value, index, total } = data;
                try {
                    await idbSet(key, value);
                    receivedCount++;
                    const percent = Math.min(100, Math.round((receivedCount / Math.max(1, totalCount)) * 100));
                    progressFill.style.width = `${percent}%`;
                    percentText.textContent = `${percent}%`;
                    statusMessage.textContent = `正在寫入: ${key} (${receivedCount}/${totalCount})`;

                    // 回報單項 ACK 給發送端
                    if (senderSource && senderOrigin) {
                        senderSource.postMessage({
                            type: 'WMC_MIGRATE_ITEM_ACK',
                            index
                        }, senderOrigin);
                    }
                } catch (err) {
                    addLog(`寫入項目失敗 (${key}): ${err.message}`, 'warn');
                }
                return;
            }

            // 4. 傳輸完成 (Complete)
            if (data.type === 'WMC_MIGRATE_COMPLETE') {
                progressFill.style.width = '100%';
                percentText.textContent = '100%';
                statusSpinner.style.display = 'none';
                statusMessage.innerHTML = '<span style="color: var(--accent-success)">✓ 資料遷移成功！所有專案已保存至新網域。</span>';
                subtitleText.textContent = '所有譜面、音訊與專案已順利轉移，現在即可開始創作！';
                addLog(`遷移大功告成！已成功儲存 ${receivedCount} 個資料項`, 'success');
                launchBtn.disabled = false;

                // 回報完成 ACK
                if (senderSource && senderOrigin) {
                    senderSource.postMessage({
                        type: 'WMC_MIGRATE_FINISH',
                        success: true,
                        count: receivedCount
                    }, senderOrigin);
                }
            }
        });

        // 若是由舊站以 window.open 開啟，通知 opener 我們已準備好
        if (window.opener) {
            window.opener.postMessage({
                type: 'WMC_RECEIVER_READY',
                url: window.location.href
            }, '*');
        }
    </script>
</body>

</html>
